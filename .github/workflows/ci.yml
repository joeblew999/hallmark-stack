name: CI

# One command, the same here and on your machine: `aube run ci` (lint, typecheck, unit and workerd tests, build,
# end-to-end tests in Chrome, Hallmark's lint of the rendered page). mise installs the pinned node and aube.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install mise
        run: curl -fsSL https://mise.run | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the pinned tools (node, aube)
        run: mise trust --yes && mise install
      - name: Install the packages
        run: mise exec -- aube install --frozen-lockfile
      - name: aube run ci
        run: mise exec -- aube run ci
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            .hallmark/shots
          retention-days: 7
