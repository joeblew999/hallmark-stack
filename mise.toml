#:schema https://mise.jdx.dev/schema/mise.json

# The control plane: every tool this repo needs, pinned (`mise install` gets them; nothing is installed globally),
# and the tasks for what sits outside the app: Cloudflare, Gateweave ID, deploying. The app's own commands are
# package.json scripts. All of them are in docs/commands.md.
#
# Where things are deployed (Workers Custom Domains on ubuntusoftware.net, Cloudflare account gedw99@gmail.com):
#   https://courts.ubuntusoftware.net   this app        (app:deploy; its address is the route in wrangler.jsonc)
#   https://id.ubuntusoftware.net       Gateweave ID    (id:deploy; its address is ID_DOMAIN in scripts/id-release.mjs)

[settings]
# Any npm: tool mise installs goes through aube too.
npm.package_manager = "aube"
# One task at a time, in the order `depends` lists them: the deploys log in, and id:deploy waits for a person.
jobs = 1

[tools]
# The one JavaScript runtime (Track pins Node 24 in its .node-version).
node = "24.22.2"
# Installs the Node packages from package.json and pnpm-lock.yaml. No npm, no pnpm.
aube = "2.9.0"

[env]
# The packages' own binaries (wrangler, vite, biome, playwright) by name.
_.path = ["{{config_root}}/node_modules/.bin"]
# Node's own fetch (the deploy tasks' up-checks) through HTTPS_PROXY where one is set, as in a Claude cloud session;
# with none set, as on a Mac, it changes nothing.
NODE_USE_ENV_PROXY = "1"

[tasks."cloudflare:login"]
description = "Cloudflare login for this repo (Wrangler's device-code flow): prints the approval link with the code on it, waits, then says who is logged in; already logged in, it just says who"
run = "node scripts/cloudflare-login.mjs"

[tasks."cloudflare:logout"]
description = "End this repo's Cloudflare login (wrangler logout: the token is revoked and deleted here); not logged in, it says so"
run = "node scripts/cloudflare-logout.mjs"

[tasks."id:deploy"]
description = "Gateweave ID (pinned v0.10.6) onto Cloudflare at https://id.ubuntusoftware.net, by ID's own deploy script, set up for the internet: email from its own name id.ubuntusoftware.net (Email Sending), its Turnstile, the breached-password check; OIDC_PAIRWISE_SECRET and TURNSTILE_SECRET_KEY set once, kept by Cloudflare, never printed; waits until its provider answers, then id:claim, then opens sign-up (scripts/id-deploy.mjs)"
run = "node scripts/id-deploy.mjs"

[tasks."id:claim"]
description = "Who owns Gateweave ID: a new server prints its address and waits up to 10 minutes for you to use Create account there in the browser, with the code ID emails you (the first account owns it); the owner must be your Cloudflare login's email, or it stops (scripts/id-claim.mjs)"
run = "node scripts/id-claim.mjs"

[tasks."app:deploy"]
description = "This app onto Cloudflare at https://courts.ubuntusoftware.net: build, D1 migrations before new code (after, on the first deploy, which creates the D1), BETTER_AUTH_SECRET made once and never printed; waits until the site answers (scripts/app-deploy.mjs)"
run = "node scripts/app-deploy.mjs"

[tasks."app:register"]
description = "This app registers itself with Gateweave ID, after id:deploy and app:deploy; its client id and secret go straight into its Worker secrets, never printed; registered only if ID has its client and it has the settings, otherwise it registers again; then proves sign-in reaches ID's login page (scripts/app-register.mjs)"
depends = ["id:deploy", "app:deploy"]
run = "node scripts/app-register.mjs"

[tasks."all:deploy"]
description = "Everything onto Cloudflare: app:register, which mise runs after id:deploy and app:deploy; then all:e2e proves it"
depends = ["app:register"]
run = "mise run all:e2e"

[tasks."all:e2e"]
description = "The live courts site through the live Gateweave ID, in Chrome, no human: two throwaway people invited into ID sign in, a double booking is refused, a cancel frees it, courts' Sign out signs one out of courts, signing out at ID ends the other's courts session; Hallmark's lint on the signed-in pages; then they are deleted (scripts/all-e2e.mjs)"
run = "node scripts/all-e2e.mjs"

[tasks."app:undeploy"]
description = "This app off Cloudflare, every piece: its registration with Gateweave ID, its Worker (domain, Durable Object, secrets, cron) and its D1; accounts and bookings gone for good (scripts/app-undeploy.mjs)"
run = "node scripts/app-undeploy.mjs"

[tasks."id:undeploy"]
description = "Gateweave ID off Cloudflare, every piece: its Worker (domain, secrets, OIDC_PAIRWISE_SECRET included), its D1, its logouts queue, its Turnstile widget and Email Sending for id.ubuntusoftware.net; every account gone, and every app's ids change when it comes back (scripts/id-undeploy.mjs)"
run = "node scripts/id-undeploy.mjs"

[tasks."all:undeploy"]
description = "Everything off Cloudflare, in order: app:undeploy, id:undeploy"
run = ["mise run app:undeploy", "mise run id:undeploy"]
