#:schema https://mise.jdx.dev/schema/mise.json

# The control plane: every tool this repo needs, pinned (`mise install` gets them; nothing is installed globally),
# and the tasks for what sits outside the app: Cloudflare, Gateweave ID, deploying. The app's own commands are
# package.json scripts. All of them are in docs/commands.md.
#
# Two environments, Wrangler's way: staging and production, named on every deploy task (`mise run all:deploy staging`);
# no task has a default, so production is only ever deployed by asking for it. Development is wrangler.jsonc's top
# level and is never deployed. Where each is (Workers Custom Domains on ubuntusoftware.net, Cloudflare account
# gedw99@gmail.com; each address is a route in wrangler.jsonc or id.jsonc):
#   staging      https://courts-staging.ubuntusoftware.net   this app       Worker courts-staging, D1 courts-staging
#                https://id-staging.ubuntusoftware.net       Gateweave ID   Worker id-staging, D1 id-staging
#   production   https://courts.ubuntusoftware.net           this app       Worker courts-production, D1 courts-production
#                https://id.ubuntusoftware.net               Gateweave ID   Worker id-production, D1 id-production

# The mise this repo was last checked with (2026-11-08). An older mise stops here with a message, instead of failing
# later on something it lacks (daemons, deps, task logs).
min_version = "2026.11.3"

[settings]
# mise.lock holds every tool's exact download and checksum, for Linux (cloud sessions, CI) and Apple-silicon Macs.
# mise install checks against it; mise-check:update-mise and mise lock refresh it. (aube and Pitchfork make no Intel Mac builds.)
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
# mise's daemons ([daemons] below, run by Pitchfork) are experimental in mise; all:dev uses them.
experimental = true
# npm: tools (the skills CLI) are installed by the aube built into mise. The aube in [tools] is the command you run.
npm.package_manager = "aube"
# The agent skills our tools ship (aube's, Pitchfork's), for the exact versions pinned: mise fetches them on install
# and links them into .claude/skills, where Claude reads them, after every install, use and upgrade. The links are
# per machine: mise keeps them out of git (.git/info/exclude).
skills.dir = ".claude/skills"
skills.auto_sync = true
# node's version is package.json's devEngines.runtime, the one pin, which aube and mise both read.
idiomatic_version_file_enable_tools = ["node"]
# Every mise run says how long each task took, on every OS.
task.timings = true
# Seeing what ran (README): mise tasks history lists every run and its result; mise tasks log <task> prints the last
# run's output. mise keeps that output only when it reads it, so each line is printed with the task's name (prefix).
task.logs = true
task.output = "prefix"
task.history_limit = 100
# One task at a time, in the order `depends` lists them: the deploys log in, and id:deploy waits for a person.
jobs = 1

[tools]
# The tools that run the repo (tools:check; moved by mise run mise-check:update-mise). The app's packages and node are
# package.json's (deps:check; mise-check:update-packages, node:update). README, Keeping versions current.
# Installs the Node packages from package.json and aube-lock.yaml. No npm, no pnpm.
aube = { version = "2.9.0", workflow = [
  "release-plz.yml@refs/heads/main",
  "release.yml@refs/heads/main",
] }
# The skills CLI (vercel-labs/skills), as Hallmark's README installs it: mise run hallmark:update.
"npm:skills" = "1.7.6"
# Pitchfork runs the two dev servers in the background for mise run all:dev ([daemons] below).
pitchfork = { version = "2.33.1", workflow = "release.yml@refs/heads/main" }
# Tailscale: mise run all:dev puts the local pair on public https addresses (Funnel), signed in from a browser link.
tailscale = "1.104.5"

[deps.aube]
# The app's packages (package.json, aube-lock.yaml) are installed by mise itself, before any mise run or mise exec,
# whenever they changed or node_modules is missing. Nobody runs aube install by hand.
auto = true

[env]
# The packages' own binaries (wrangler, vite, biome, playwright) by name.
_.path = ["{{config_root}}/node_modules/.bin"]
# Node's own fetch (the deploy tasks' up-checks) through HTTPS_PROXY where one is set, as in a Claude cloud session;
# with none set, as on a Mac, it changes nothing.
NODE_USE_ENV_PROXY = "1"

# mise-check's names (docs/mise-check/README.md): setup gets a machine ready, test runs every check and test. GitHub
# runs both through mise run mise-check:verify (.github/workflows/mise-check.yml), the same as any machine.
[tasks.setup]
description = "Installs the app's packages (mise runs this itself before any task when they changed)"
run = "mise deps"

[tasks.test]
description = "Runs every check and test, in order. GitHub runs this too, through mise run mise-check:verify"
run = [
  "mise fmt --check",
  "mise run docs:check",
  "aube run check",
  "aube run config:check",
  "aube run typecheck",
  "aube run test",
  "aube run dev:setup",
  "aube run build",
  "aube run test:e2e",
]

[tasks."docs:update"]
description = "Rewrites docs/commands.md: the mise tasks (written by mise) and the app's scripts"
run = [
  "mise generate task-docs --inject --output docs/commands.md",
  "node scripts/commands.mjs",
]

[tasks."docs:check"]
description = "Fails if docs/commands.md is out of date. Fix it with mise run docs:update"
run = ["mise run docs:update", "git diff --exit-code -- docs/commands.md"]

# Keeping versions current (README). Moving pins is mise-check's: mise run mise-check:update (the mise tools, then the
# app's packages). These read only, except node:update. Not in CI: their answers change whenever something is published.
[tasks."deps:check"]
description = "Lists app packages that are out of date or have security warnings"
run = ["aube audit", "aube outdated"]

[tasks."tools:check"]
description = "Lists tools in mise.toml that are out of date"
run = "mise outdated --bump"

[tasks."node:update"]
description = "Moves node to its newest 24.x, in package.json (devEngines.runtime). Then mise run mise-check:verify"
run = "aube runtime set node 24 --save-exact"

[tasks."id:check"]
description = "Lists Gateweave ID releases newer than the one we use, with links to their notes, and says if they change the database"
run = "node scripts/id-version.mjs check"

[tasks."id:update"]
description = "Moves us to the newest Gateweave ID release. Then mise run mise-check:verify; deploy it with id:deploy"
run = "node scripts/id-version.mjs update"

# Hallmark (README, Hallmark locked to this stack). Each task that designs opens the `claude` already on this machine
# (Claude Code is the machine's, like mise: this repo never installs it) on the repo, with the request written out,
# so you watch and approve as it works. Hallmark reads DESIGN.md first, so whatever it builds is a route on this stack.
[tasks."hallmark:page"]
interactive = true
usage = '''
arg "<route>" help="the new page's route, such as /prices"
arg "<brief>" help="what the page is for and what goes on it, in your words"
flag "--scope <scope>" help="page (read: marketing gates) or app (worked in: app gates)" default="page" { choices "page" "app" }
'''
description = "Opens Claude to design a new page with Hallmark, then lints it"
run = '''
claude "/hallmark Build a new page. Route: ${usage_route}, as its TanStack route file in src/routes/. Hallmark scope: ${usage_scope}. Brief: ${usage_brief}. DESIGN.md is locked and is the rule, its Pages section first: open with SiteHeader and close with Footer (src/components/site/chrome.tsx), and lead with the page's own real thing on its first screen, and add the route to PAGES and SCOPES in src/lib/pages.ts in the same change. When it is built, run mise run hallmark:lint and fix every finding until it is clean."
'''

[tasks."hallmark:redesign"]
interactive = true
usage = 'arg "<path>" help="the route file or folder to redesign, such as src/routes/index.tsx"'
description = "Opens Claude to redesign an existing page with Hallmark, keeping its content, then lints it"
run = '''
claude "/hallmark redesign ${usage_path}. DESIGN.md is locked and is the rule, its Pages section first. When it is done, run mise run hallmark:lint and fix every finding until it is clean."
'''

[tasks."hallmark:audit"]
interactive = true
usage = 'arg "<path>" help="the route file or folder to audit, such as src/routes"'
description = "Opens Claude to review a page with Hallmark. Reports only, changes nothing"
run = 'claude "/hallmark audit ${usage_path}"'

[tasks."hallmark:lint"]
description = "Builds the site and checks every page against Hallmark's design rules"
run = ["aube run build", "aube run hallmark"]

[tasks."hallmark:update"]
description = "Updates Hallmark to its newest version, then lints every page"
env = { DISABLE_TELEMETRY = "1" }
run = [
  "skills add nutlope/hallmark --skill hallmark --agent claude-code --copy --yes",
  "mise run hallmark:lint",
]

[tasks."cloudflare:login"]
description = "Logs this repo in to Cloudflare. Prints a link to approve, then waits"
run = "node scripts/cloudflare-login.mjs"

[tasks."cloudflare:logout"]
description = "Logs this repo out of Cloudflare"
run = "node scripts/cloudflare-logout.mjs"

[tasks."tailscale:login"]
description = "Puts the local site and Gateweave ID on public https addresses through Tailscale. Prints sign-in links, then waits"
run = "node scripts/tailscale.mjs up"

[tasks."tailscale:logout"]
description = "Takes the local site off Tailscale. The machines stay in your Tailscale list until you remove them there"
run = "node scripts/tailscale.mjs down"

[tasks."all:dev"]
description = "Starts Gateweave ID and the site on this machine, on public addresses, signed in together. They keep running: mise daemons logs, mise daemons stop"
run = "node scripts/dev.mjs"

[tasks."id:deploy"]
usage = 'arg "<env>" help="staging or production" { choices "staging" "production" }'
description = "Deploys Gateweave ID to staging or production"
run = "node scripts/id-deploy.mjs {{usage.env}}"

[tasks."id:claim"]
usage = 'arg "<env>" help="staging, production or development" { choices "staging" "production" "development" }'
description = "Makes you the owner of a new Gateweave ID. Prints its address and waits for you to create your account"
run = "node scripts/id-claim.mjs {{usage.env}}"

[tasks."app:deploy"]
usage = 'arg "<env>" help="staging or production" { choices "staging" "production" }'
description = "Deploys the site to staging or production"
run = "node scripts/app-deploy.mjs {{usage.env}}"

[tasks."app:register"]
usage = 'arg "<env>" help="staging, production or development" { choices "staging" "production" "development" }'
description = "Connects the site to its Gateweave ID so people can sign in. Runs both deploys first"
depends = ["id:deploy {{usage.env}}", "app:deploy {{usage.env}}"]
run = "node scripts/app-register.mjs {{usage.env}}"

[tasks."all:deploy"]
usage = 'arg "<env>" help="staging or production" { choices "staging" "production" }'
description = "Deploys Gateweave ID and the site, connects them, then tests them"
depends = ["app:register {{usage.env}}"]
run = "mise run all:e2e {{usage.env}}"

[tasks."all:e2e"]
usage = 'arg "<env>" help="staging, production or development" { choices "staging" "production" "development" }'
description = "Tests the running site end to end in Chrome: sign in, book, cancel, sign out. Production only reads"
run = "aube exec playwright test --config playwright.live.config.ts --project {{usage.env}}"

[tasks."app:undeploy"]
confirm = { message = "Remove the site from {{usage.env}}? Its bookings are lost for good.", default = "no" }
usage = 'arg "<env>" help="staging or production" { choices "staging" "production" }'
description = "Removes the site from staging or production. Asks first: its bookings are lost"
run = "node scripts/app-undeploy.mjs {{usage.env}}"

[tasks."id:undeploy"]
confirm = { message = "Remove Gateweave ID from {{usage.env}}? Its accounts are lost for good.", default = "no" }
usage = 'arg "<env>" help="staging or production" { choices "staging" "production" }'
description = "Removes Gateweave ID from staging or production. Asks first: its accounts are lost"
run = "node scripts/id-undeploy.mjs {{usage.env}}"

[tasks."all:undeploy"]
usage = 'arg "<env>" help="staging or production" { choices "staging" "production" }'
description = "Removes the site, then Gateweave ID"
depends = ["app:undeploy {{usage.env}}"]
run = "mise run id:undeploy {{usage.env}}"

# What a machine needs that mise doesn't install: mise doctor project checks each, and says how to get what's missing.
[doctor.checks.chrome-linux]
description = "Google Chrome, for the end-to-end tests and Hallmark's lint"
run = "command -v google-chrome"
os = ["linux"]
hint = "Install Google Chrome: https://www.google.com/chrome/"

[doctor.checks.chrome-macos]
description = "Google Chrome, for the end-to-end tests and Hallmark's lint"
run = "test -d '/Applications/Google Chrome.app'"
os = ["macos"]
hint = "Install Google Chrome: https://www.google.com/chrome/"

[doctor.checks.claude]
description = "Claude Code, for mise run hallmark:page, hallmark:redesign and hallmark:audit"
run = "command -v claude"
hint = "Install Claude Code: https://docs.claude.com/en/docs/claude-code/setup"

# The two dev servers that mise run all:dev starts, run by Pitchfork (pinned above) in the background. mise waits until
# each answers, and they keep running after all:dev ends. mise daemons logs id (or courts) shows their output, mise
# daemons status whether they run, mise daemons stop stops them. Each answers on its Tailscale address
# (.tailscale/origins.json, from scripts/tailscale.mjs), with live reload on 443.
[daemons_settings]
namespace = "hallmark-stack"

[daemons.id]
run = '''
export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$(node -p "require('./.tailscale/origins.json').hosts.join()")"
cd vendor/gateweave-id/apps/web
PATH="$PWD/node_modules/.bin:$PATH" exec vite dev --config ../../../../scripts/id-vite.config.mjs --port 4730 --strictPort
'''
env = { DEV_HMR_CLIENT_PORT = "443" }
ready_http = "http://localhost:4730/.well-known/openid-configuration"

[daemons.courts]
run = '''
export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$(node -p "require('./.tailscale/origins.json').hosts.join()")"
exec vite dev --port 4710 --strictPort
'''
env = { DEV_HMR_CLIENT_PORT = "443" }
ready_http = "http://localhost:4710/api/auth/ok"
depends = ["id"]
