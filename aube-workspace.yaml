# aube's project settings (mise.toml pins aube). A dependency's build script runs only when allowed here, so an
# unreviewed one fails the install (and CI) instead of being skipped. Track allows the same three.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Packages held on purpose, kept out of `aube update` (mise run deps:update): see README, Provenance and pins.
updateConfig:
  ignoreDependencies:
    - puppeteer-core
